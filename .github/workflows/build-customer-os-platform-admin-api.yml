name: customer-os-platform-admin-api

on:
  push:
    branches: [ "otter" ]
    paths:
      - packages/server/customer-os-common-module/**
      - packages/server/customer-os-postgres-repository/**
      - packages/server/customer-os-neo4j-repository/**
      - packages/server/customer-os-platform-admin-api/**
      - .github/workflows/build-customer-os-platform-admin-api.yml
  pull_request:
    paths:
      - packages/server/customer-os-common-module/**
      - packages/server/customer-os-postgres-repository/**
      - packages/server/customer-os-neo4j-repository/**
      - packages/server/customer-os-platform-admin-api/**
      - .github/workflows/build-customer-os-platform-admin-api.yml
  release:
    types: [ created, edited ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/customer-os-platform-admin-api
  GOMODCACHE: ${{ github.workspace }}/go/pkg/mod
  GOBIN: ${{ github.workspace }}/go/bin
  CGO_ENABLED: 0
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

permissions:
  contents: read
  pull-requests: read
  packages: write

defaults:
  run:
    working-directory: ./packages/server/customer-os-platform-admin-api

jobs:
  test:
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: ubicloud/setup-go@v5
        with:
          go-version: stable
          cache: true
        env:
          GOPROXY: "direct"
          GOSUMDB: "off"
          GOMODCACHE: ${{ github.workspace }}/go/pkg/mod

      - name: Build
        run: make all

      - name: Configure Test Folders
        id: test-folders
        run: |
          test_folders=$(go list ./... | grep -v /gen | grep -v /test | paste -sd "," -)
          echo "{name}={test_folders}" >> $GITHUB_OUTPUT

      - name: Install gotestsum
        run: |
          mkdir -p "${{ env.GOBIN }}"
          if [ ! -f "${{ env.GOBIN }}/gotestsum" ]; then
            go install gotest.tools/gotestsum@latest
          fi
          echo "${{ env.GOBIN }}" >> $GITHUB_PATH

      - name: Test
        run: gotestsum --junitfile unit-tests.xml -- -coverprofile=cover.out -coverpkg=${{ steps.test-folders.outputs.test_folders }} ./...

      - name: Test Report
        uses: mikepenz/action-junit-report@v5
        if: always()    # run this step even if previous step failed
        with:
          report_paths: ./packages/server/customer-os-platform-admin-api/unit-tests.xml    # Path to test results
          include_passed: true
          annotate_only: true
          detailed_summary: true

      - name: Compute Code Coverage
        id: compute_code_coverage
        run: |
          echo "## Code Coverage" >> $GITHUB_STEP_SUMMARY
          echo "|Filename|Function|Coverage|" >> $GITHUB_STEP_SUMMARY
          echo "|--------|--------|--------|" >> $GITHUB_STEP_SUMMARY
          go tool cover -func=cover.out |sed -r  's/[[:space:]]+/|/g'|sed -r 's/$/|/g'|sed -r 's/^/|/g' >> $GITHUB_STEP_SUMMARY
          go tool cover -func=cover.out | sed -r 's/[[:space:]]+/|/g' | sed -r 's/$/|/g' | sed -r 's/^/|/g' | tail -n 1 > test-coverage.txt
          coverage=$(cat test-coverage.txt | awk -F'|' '{gsub(/%/, "", $(NF-1)); print $(NF-1)}')
          echo "coverage=$coverage" >> $GITHUB_OUTPUT

  build-amd64:
    needs:
      - test
    runs-on: ubicloud-standard-2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Create a safe tag string from the branch name (replace / with -)
      - name: Set safe tag
        id: safe-tag
        run: |
          # For PR events, use pr-NUMBER format instead of the branch name
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "value=pr-${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
          else
            # For normal branches, replace / with - to make it safe for tags
            SAFE_TAG=$(echo "${{ github.ref_name }}" | sed 's/\//-/g')
            echo "value=$SAFE_TAG" >> $GITHUB_OUTPUT
          fi
        shell: bash
        working-directory: .

      - name: Log in to the Container registry
        uses: docker/login-action@v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REPOSITORY_READ_WRITE_USERNAME }}
          password: ${{ secrets.REPOSITORY_READ_WRITE_TOKEN }}

      # Don't use BuildX for single architecture builds
      - name: Build and push amd64 image with regular Docker
        run: |
          # Build the image
          docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}-amd64 -f Dockerfile ../
          
          # Push the image
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}-amd64
        shell: bash

  build-arm64:
    needs:
      - test
    runs-on: ubicloud-standard-2-arm  # Native ARM runner
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REPOSITORY_READ_WRITE_USERNAME }}
          password: ${{ secrets.REPOSITORY_READ_WRITE_TOKEN }}

      # Don't use BuildX for single architecture builds
      - name: Build and push arm64 image with regular Docker
        run: |
          # Build the image
          docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}-arm64 -f Dockerfile ../
          
          # Push the image
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}-arm64
        shell: bash

  create-manifest:
    needs: [build-amd64, build-arm64]
    runs-on: ubicloud-standard-2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Create a safe tag string from the branch name (replace / with -)
      - name: Set safe tag
        id: safe-tag
        run: |
          # For PR events, use pr-NUMBER format instead of the branch name
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "value=pr-${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
          else
            # For normal branches, replace / with - to make it safe for tags
            SAFE_TAG=$(echo "${{ github.ref_name }}" | sed 's/\//-/g')
            echo "value=$SAFE_TAG" >> $GITHUB_OUTPUT
          fi
        shell: bash
        working-directory: .

      - name: Log in to the Container registry
        uses: docker/login-action@v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REPOSITORY_READ_WRITE_USERNAME }}
          password: ${{ secrets.REPOSITORY_READ_WRITE_TOKEN }}

      # Enable Docker experimental features for manifest command
      - name: Enable Docker experimental
        run: |
          mkdir -p ~/.docker
          echo '{"experimental": "enabled"}' > ~/.docker/config.json
        shell: bash
        working-directory: .

      - name: Create and push manifest
        run: |
          # Create and push the SHA manifest
          docker manifest create ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}-amd64 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}-arm64
          
          docker manifest push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          
          # Create and push the branch/PR manifest
          docker manifest create ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.safe-tag.outputs.value }} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}-amd64 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}-arm64
          
          docker manifest push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.safe-tag.outputs.value }}
          
          # If this is the otter branch, also tag as latest
          if [[ "${{ github.ref_name }}" == "otter" ]]; then
            docker manifest create ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}-amd64 \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}-arm64
          
            docker manifest push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          fi
          
          # For releases, also tag with the release tag
          if [[ "${{ github.event_name }}" == "release" ]]; then
            # For releases, the tag should be the release tag
            RELEASE_TAG=$(echo "${{ github.ref_name }}" | sed 's/\//-/g')
            docker manifest create ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$RELEASE_TAG \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}-amd64 \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}-arm64
          
            docker manifest push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$RELEASE_TAG
          fi
        shell: bash