name: customer-os-api

on:
  push:
    branches: ["otter"]
    paths:
      - packages/server/customer-os-common-module/**
      - packages/server/customer-os-postgres-repository/**
      - packages/server/customer-os-neo4j-repository/**
      - packages/server/customer-os-api/**
      - .github/workflows/build-customer-os-api.yml
  pull_request:
    paths:
      - packages/server/customer-os-common-module/**
      - packages/server/customer-os-postgres-repository/**
      - packages/server/customer-os-neo4j-repository/**
      - packages/server/customer-os-api/**
      - .github/workflows/build-customer-os-api.yml
  release:
    types: [created, edited]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/customer-os-api
  GOMODCACHE: ${{ github.workspace }}/go/pkg/mod
  GOBIN: ${{ github.workspace }}/go/bin
  CGO_ENABLED: 0
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

permissions:
  contents: read
  pull-requests: read
  packages: write

defaults:
  run:
    working-directory: ./packages/server/customer-os-api

jobs:
  test:
    runs-on: ubicloud-standard-2
    env:
      CGO_ENABLED: 0
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    strategy:
      fail-fast: false
      matrix:
        test-group: [neo4j, postgres, other]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: ubicloud/setup-go@v5
        with:
          go-version: stable
          cache: true
        env:
          GOPROXY: "direct"
          GOSUMDB: "off"
          GOMODCACHE: ${{ github.workspace }}/go/pkg/mod

      - name: Cache Go tools
        uses: ubicloud/cache@v4
        with:
          path: ${{ env.GOBIN }}
          key: ${{ runner.os }}-go-tools-${{ hashFiles('./packages/server/customer-os-api/go.sum') }}

      - name: Install gotestsum
        run: |
          mkdir -p "${{ env.GOBIN }}"
          if [ ! -f "${{ env.GOBIN }}/gotestsum" ]; then
            go install gotest.tools/gotestsum@latest
          fi
          echo "${{ env.GOBIN }}" >> $GITHUB_PATH

      - name: Go Cache
        id: go-cache
        uses: ubicloud/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ${{ env.GOMODCACHE }}
          key: ${{ runner.os }}-go-${{ hashFiles('packages/server/customer-os-api/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Build
        if: steps.go-cache.outputs.cache-hit != 'true'
        run: make all

      - name: Get test packages
        id: get-packages
        run: |
          # Get all packages except repository, rest, and graph/resolver
          PACKAGES=$(go list ./... | grep -v /gen | grep -v /test | grep -v /testify | grep -v "/rest" | grep -v "/repository" | grep -v "/graphql/resolver" | paste -sd " " -)
          echo "packages=${PACKAGES}" >> "$GITHUB_OUTPUT"

      - name: Run Tests
        id: run-tests
        run: |
          echo "Running tests for ${{ matrix.test-group }} repositories..."
          case ${{ matrix.test-group }} in
            neo4j)
            gotestsum --junitfile unit-tests.xml -- -coverprofile=cover.out ../customer-os-neo4j-repository/repository/...
            ;;
            postgres)
            gotestsum --junitfile unit-tests.xml -- -coverprofile=cover.out ../customer-os-postgres-repository/repository/...
            ;;
            other)
            gotestsum --junitfile unit-tests.xml -- -coverprofile=cover.out ${{ steps.get-packages.outputs.packages }}
            ;;
          esac

  build-publish:
    needs: []
    runs-on: ubicloud-standard-2
    if: github.ref == 'refs/heads/otter' || github.event_name == 'release'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            network=host

      - name: Log in to the Container registry
        uses: docker/login-action@v3.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REPOSITORY_READ_WRITE_USERNAME }}
          password: ${{ secrets.REPOSITORY_READ_WRITE_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5.7.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Push Docker image
        uses: docker/build-push-action@v6.15.0
        with:
          context: ./packages/server/
          file: ./packages/server/customer-os-api/Dockerfile
          push: ${{ github.ref_name == 'otter' || github.event_name == 'release' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
