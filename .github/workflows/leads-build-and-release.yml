name: Leads Build and Release

on:
  pull_request:
    paths:
      - packages/server/leads/**
      - .github/workflows/leads-workflow.yml

  push:
    branches:
      - otter
    paths:
      - packages/server/leads/**
      - .github/workflows/leads-workflow.yml

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/customer-os-leads
  GOMODCACHE: ${{ github.workspace }}/go/pkg/mod
  GOBIN: ${{ github.workspace }}/go/bin
  CGO_ENABLED: 0
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

permissions:
  contents: write # Needed for creating tags and releases
  pull-requests: read
  packages: write # Needed for pushing to ghcr.io

jobs:
  build:
    # This job runs on both PRs and pushes to otter
    runs-on: ubicloud-standard-2
    outputs:
      is_otter_branch: ${{ steps.check-branch.outputs.is_otter }}
    steps:
      - uses: actions/checkout@v4

      - name: Check if otter branch
        id: check-branch
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/otter" ]]; then
            echo "is_otter=true" >> $GITHUB_OUTPUT
          else
            echo "is_otter=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Go
        uses: ubicloud/setup-go@v5
        with:
          go-version: stable
          cache: true
        env:
          GOPROXY: "direct"
          GOSUMDB: "off"
          GOMODCACHE: ${{ env.GOMODCACHE }}

      # Cache Go tools installed via go install
      - name: Cache Go tools
        uses: ubicloud/cache@v4
        with:
          path: ${{ env.GOBIN }}
          key: ${{ runner.os }}-go-tools-${{ hashFiles('./packages/server/leads/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-tools-

      # Cache Go modules and build cache
      - name: Go Cache
        id: go-cache
        uses: ubicloud/cache@v4
        with:
          path: |
            ~/.cache/go-build # Standard Go build cache location
            ${{ env.GOMODCACHE }} # Module cache location defined in env
          key: ${{ runner.os }}-go-${{ hashFiles('packages/server/leads/go.sum') }} # Key based on go.sum
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install dependencies
        run: |
          ./packages/server/leads/deployments/build/install-dependencies.sh

      - name: Build Go Binary
        run: |
          ./packages/server/leads/deployments/build/build.sh

  check-release-needed:
    needs: build
    # Only run on push to otter branch and if build job succeeds
    if: needs.build.outputs.is_otter_branch == 'true'
    runs-on: ubicloud-standard-2
    outputs:
      version_bump: ${{ steps.run_check_script.outputs.version_bump }}
      app_name: ${{ steps.run_check_script.outputs.app_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Fetch all history to check tags and commit messages
          fetch-depth: 0

      - name: Run check release needed script
        id: run_check_script
        run: ./packages/server/leads/deployments/build/check-release-needed.sh "leads"
        env:
          GITHUB_OUTPUT: ${{ github.output }}

  build-and-release:
    needs: check-release-needed
    # Only run if a release is needed (version_bump is not 'skip')
    if: needs.check-release-needed.outputs.version_bump != 'skip'
    runs-on: ubicloud-standard-2-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: run_version_script
        run: ./packages/server/leads/deployments/build/version.sh "${{ needs.check-release-needed.outputs.version_bump }}" "${{ needs.check-release-needed.outputs.app_name }}"
        env:
          GITHUB_OUTPUT: ${{ github.output }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ARM64 image
        id: build-push
        run: |
          DIGEST=$(./packages/server/leads/deployments/build/build-push.sh \
            "${{ env.REGISTRY }}" \
            "${{ env.IMAGE_NAME }}" \
            "${{ steps.run_version_script.outputs.next_version }}" \
            "linux/arm64" \
            "arm64")
          echo "digest=${DIGEST}" >> $GITHUB_OUTPUT

      - name: Create latest tag
        run: |
          docker buildx imagetools create \
            --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.run_version_script.outputs.next_version }}-arm64

      - name: Create Git tag
        run: |
          echo "Creating tag ${{ steps.run_version_script.outputs.next_version }}"
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git tag -a ${{ steps.run_version_script.outputs.next_version }} -m "Release ${{ steps.run_version_script.outputs.next_version }}"
          git push origin ${{ steps.run_version_script.outputs.next_version }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.run_version_script.outputs.next_version }}
          name: "Leads Release ${{ steps.run_version_script.outputs.next_version }}"
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload workflow outputs
        uses: actions/upload-artifact@v4
        with:
          name: workflow-data
          path: workflow-data.json
