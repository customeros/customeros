name: Release Leads Workflow

on:
  workflow_run:
    workflows: ["build-leads"]
    types:
      - completed
    branches:
      - otter

permissions:
  contents: write
  packages: write
  pull-requests: read

env:
  REGISTRY: ghcr.io
  REPOSITORY_BASE: ${{ github.repository_owner }}
  IMAGE_NAME: ${{ github.repository_owner }}/customer-os-leads
  APP_DIR: ./packages/server/leads

jobs:
  check-release-needed:
    # Ensure it only runs if the triggering workflow succeeded and was on the correct branch
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'otter'
    runs-on: ubicloud-standard-2
    outputs:
      version_bump: ${{ steps.run_check_script.outputs.version_bump }}
      app_name: ${{ steps.check.outputs.app_name }}
      app_path: ${{ steps.check.outputs.app_path }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Fetch all history to check tags and commit messages
          fetch-depth: 0

      - name: Run check release needed script
        id: run_check_script
        run: ./packages/server/leads/deployments/build/check-release-needed.sh

  create-release:
    needs: check-release-needed
    # Only run if the previous job determined a release is needed
    if: needs.check-release-needed.outputs.version_bump != 'skip'
    runs-on: ubicloud-standard-2
    outputs:
      next_version: ${{ steps.run_version_script.outputs.next_version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run version script
        id: run_version_script
        # Pass the version_bump type from the previous job as an argument
        run: ./packages/server/leads/deployments/build/version.sh "${{ needs.check-release-needed.outputs.version_bump }}" "${{ needs.check_release_needed.outputs.app_name }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Use the next version calculated by the script
          tag_name: ${{ steps.run_version_script.outputs.next_version }}
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload workflow outputs
        uses: actions/upload-artifact@v4
        with:
          name: workflow-data
          path: workflow-data.json

  publish-images:
    needs: create-release
    runs-on: ubicloud-standard-2-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ARM64 image
        run: |
          ./packages/server/leads/deployments/build/build-push.sh \
            "${{ env.REGISTRY }}" \
            "${{ env.IMAGE_NAME }}" \
            "${{ needs.create-release.outputs.next_version }}" \
            "linux/arm64" \
            "arm64" > /dev/null

          # Create the latest tag
          docker buildx imagetools create \
            --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.create-release.outputs.next_version }}-arm64
