name: CustomerOS API Build (PR)

on:
  pull_request:
    paths:
      - ".github/workflows/customer-os-api-build.yml"
      - "packages/server/customer-os-api/**"
      - "packages/server/customer-os-common-module/**"
      - "packages/server/customer-os-neo4j-repository/**"
      - "packages/server/customer-os-postgres-repository/**"
  push:
    tags:
      - 'v*'

env:
  APP_PATH: packages/server/customer-os-api
  GQL_PATH: packages/server/customer-os-api/gqlgen.yml
  CGO_ENABLED: 0
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

permissions:
  pull-requests: read

jobs:
  build:
    runs-on: ubicloud-standard-2

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: ubicloud/setup-go@v5
        with:
          go-version: 1.24.2
          cache: true
        env:
          GOPROXY: "direct"
          GOSUMDB: "off"

      - name: Install dependencies
        run: |
          ./deployment/runners/install-dependencies.sh

      - name: Build Go Binary
        run: |
          ./deployment/runners/build.sh -p ${{ env.APP_PATH }} ${{ env.GQL_PATH }}
