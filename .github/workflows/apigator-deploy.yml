name: APIgator API Deploy
on:
  push:
    tags:
      - "v*.*.*"
env:
  APP_NAME: apigator
  APP_PATH: packages/server/apigator
  IMAGE_NAME: apigator
  REGISTRY: ghcr.io
  CGO_ENABLED: 0
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  CLOUD_REPO: customeros/cloud

permissions:
  contents: write
  pull-requests: read
  packages: write

jobs:
  deploy:
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Set up Go
        uses: ubicloud/setup-go@v5
        with:
          go-version: 1.24.2
          cache: true
        env:
          GOPROXY: "direct"
          GOSUMDB: "off"

      - name: Install dependencies
        run: |
          ./deployment/runners/install-dependencies.sh

      - name: Build Go binary
        run: |
          ./deployment/runners/build.sh ${{ env.APP_PATH }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.DEPLOY_TRIGGER_GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push container image
        run: |
          ./deployment/runners/build-and-push-image.sh \
            ${{ env.REGISTRY }} \
            ${{ env.IMAGE_NAME }} \
            ${{ env.VERSION }} \
            "linux/arm64" \
            "arm64" \
            "customeros" \
            ${{ env.APP_PATH }}

      - name: Checkout cloud repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CLOUD_REPO }}
          token: ${{ secrets.CLOUD_REPO_KEY }}
          path: cloud-repo
          fetch-depth: 1

      - name: Update cloud version
        run: |
          ./deployment/runners/update-cloud.sh ${{ env.APP_NAME }} ${{ env.VERSION }}
