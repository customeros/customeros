name: Build Leads Workflow

on:
  pull_request:
    paths:
      - packages/server/leads/**
      - .github/workflows/build-leads.yml
      - .github/workflows/release-leads.yml

  push:
    branches:
      - otter
    paths:
      - packages/server/leads/**
      - .github/workflows/build-leads.yml
      - .github/workflows/release-leads.yml

  release:
    types: [created, edited]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/customer-os-leads
  GOMODCACHE: ${{ github.workspace }}/go/pkg/mod
  GOBIN: ${{ github.workspace }}/go/bin
  CGO_ENABLED: 0
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

permissions:
  contents: read
  pull-requests: read
  packages: write

jobs:
  build:
    # This job runs on PRs and also as the first step for push/release triggers.
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: ubicloud/setup-go@v5
        with:
          go-version: stable
          cache: true
        env:
          GOPROXY: "direct"
          GOSUMDB: "off"
          GOMODCACHE: ${{ env.GOMODCACHE }}

      # Cache Go tools installed via go install
      - name: Cache Go tools
        uses: ubicloud/cache@v4
        with:
          path: ${{ env.GOBIN }}
          key: ${{ runner.os }}-go-tools-${{ hashFiles('./packages/server/leads/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-tools-

      # Cache Go modules and build cache
      - name: Go Cache
        id: go-cache
        uses: ubicloud/cache@v4
        with:
          path: |
            ~/.cache/go-build # Standard Go build cache location
            ${{ env.GOMODCACHE }} # Module cache location defined in env
          key: ${{ runner.os }}-go-${{ hashFiles('packages/server/leads/go.sum') }} # Key based on go.sum
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install dependencies
        run: |
          ./packages/server/leads/deployments/build/install-dependencies.sh

      - name: Build Go Binary
        run: |
          ./packages/server/leads/deployments/build/build.sh # Make sure this script includes go build .
          # You might add steps here to verify the build artifacts exist

  prepare:
    needs: [build]
    runs-on: ubicloud-standard-2
    if: github.ref == 'refs/heads/otter' || github.event_name == 'release'
    outputs:
      safe-tag: ${{ steps.safe-tag.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - name: Set safe tag
        id: safe-tag
        run: |
          SAFE_TAG=$(bash ./packages/server/leads/deployments/build/get-safe-tag.sh "${{ github.event_name }}" "${{ github.ref_name }}" "${{ github.event.pull_request.number }}")
          echo "value=${SAFE_TAG}" >> $GITHUB_OUTPUT

  build-arm64:
    needs: [prepare]
    runs-on: ubicloud-standard-2-arm
    # This job only runs on push to otter or release
    if: github.ref == 'refs/heads/otter' || github.event_name == 'release'
    outputs:
      digest: ${{ steps.digest.outputs.value }}
    steps:
      - uses: actions/checkout@v4 # Checkout required

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build and push the ARM64 image
      - name: Build and push arm64 image
        id: digest
        run: |
          DIGEST=$(bash ./packages/server/leads/deployments/build/build-push.sh "${{ env.REGISTRY }}" "${{ env.IMAGE_NAME }}" "${{ github.sha }}" "linux/arm64" "arm64")
          echo "value=${DIGEST}" >> $GITHUB_OUTPUT

  create-manifest:
    needs: [prepare, build-arm64]
    # This job only runs on push to otter or release
    if: github.ref == 'refs/heads/otter' || github.event_name == 'release'
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create and push manifests
        run: |
          bash ./packages/server/leads/deployments/build/create-manifest.sh \
            "${{ env.REGISTRY }}" \
            "${{ env.IMAGE_NAME }}" \
            "${{ github.sha }}" \
            "${{ needs.prepare.outputs.safe-tag }}" \
            "${{ github.ref_name }}" \
            "${{ github.event_name }}" \
            "${{ needs.build-arm64.outputs.digest }}" # Pass the arm64 digest output if needed

      # Optional: Update Kustomization in Cloud Repo
      # This job also only runs on push to otter or release
      # - name: Update Kustomization in Cloud Repo
      #   # if condition is already handled by the job-level if, but good to keep for clarity
      #   if: github.ref == 'refs/heads/otter' || github.event_name == 'release'
