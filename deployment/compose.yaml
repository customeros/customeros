networks:
  openline:

volumes:
  postgres_data:
  timescaledb_data:
  nats_data:
  neo4j_data:
  opensearch-data:
  prometheus_data:
  grafana_data:
  tempo_data:
  nui_data:

services:
  postgres:
    image: postgres:17.4
    container_name: postgres
    networks:
      - openline
    ports:
      - "5555:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: openline
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U postgres -d openline -h localhost -p 5432"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 5s

  timescaledb:
    image: timescale/timescaledb:latest-pg17
    container_name: timescaledb
    networks:
      - openline
    ports:
      - "5556:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: mailstack_timeseries
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d mailstack_timeseries -h localhost -p 5432",
        ]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 5s

  timescaledb-sidecar:
    image: postgres:17.4
    container_name: timescaledb-sidecar
    networks:
      - openline
    depends_on:
      timescaledb:
        condition: service_healthy
    volumes:
      - ./provision/timescaledb-create-db.sql:/docker-entrypoint-initdb.d/timescaledb-create-db.sql
      - ./provision/timescaledb-init.sql:/docker-entrypoint-initdb.d/timescaledb-init.sql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      PGPASSWORD: password
    command: >
      sh -c "
      until pg_isready -h timescaledb -p 5432 -U postgres -d postgres; do
        echo 'Waiting for TimescaleDB...'
        sleep 2
      done &&
      PGPASSWORD=password psql -h timescaledb -p 5432 -U postgres -d postgres -f /docker-entrypoint-initdb.d/timescaledb-create-db.sql &&
      until pg_isready -h timescaledb -p 5432 -U postgres -d telemetry; do
        echo 'Waiting for telemetry database...'
        sleep 2
      done &&
      PGPASSWORD=password psql -h timescaledb -p 5432 -U postgres -d telemetry -f /docker-entrypoint-initdb.d/timescaledb-init.sql"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    networks:
      - openline
    depends_on:
      tempo:
        condition: service_healthy
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./provision/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4319:4317" # OTLP gRPC receiver
      - "4320:4318" # OTLP HTTP receiver
    healthcheck:
      test:
        ["CMD", "wget", "--no-verbose", "--spider", "http://localhost:13133"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  tempo:
    image: grafana/tempo:latest
    container_name: tempo
    networks:
      - openline
    ports:
      - "3200:3200" # Tempo API and UI endpoint
      - "4317:4317" # OTLP gRPC endpoint
      - "4318:4318" # OTLP HTTP endpoint
    volumes:
      - tempo_data:/var/tempo
      - ./provision/tempo.yaml:/etc/tempo/tempo.yaml
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--spider",
          "http://localhost:3200/api/echo",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  nats:
    image: nats:2.11.0-alpine
    container_name: nats
    networks:
      - openline
    ports:
      - "4222:4222" # Client connections
      - "8222:8222" # HTTP management
    command:
      - "--jetstream"
      - "--http_port=8222"
      - "--debug=false"
      - "--trace=false"
    volumes:
      - nats_data:/data
      - ./provision/nats-config.conf:/nats-config.conf
    environment:
      - NATS_SERVER_NAME=nats
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3

  nui:
    image: ghcr.io/nats-nui/nui:latest
    container_name: nats-ui
    networks:
      - openline
    ports:
      - "31311:31311" # NUI Web UI port
    environment:
      - NATS_URL=nats://nats:4222
    volumes:
      - nui_data:/db
    depends_on:
      - nats

  neo4j:
    image: neo4j:latest
    container_name: neo4j
    networks:
      - openline
    volumes:
      - neo4j_data:/data
    ports:
      - "7474:7474" # HTTP
      - "7687:7687" # Bolt
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_PLUGINS=["apoc"]
    healthcheck:
      test: wget http://localhost:7474 || exit 1
      interval: 1s
      timeout: 10s
      retries: 20
      start_period: 5s

  neo4j-sidecar:
    image: ghcr.io/customeros/customeros/neo4j-sidecar:latest
    container_name: neo4j-sidecar
    networks:
      - openline
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - ./provision:/provision
    command: >
      sh -c "
      until cypher-shell -u neo4j -p password --format plain -a bolt://neo4j:7687 'RETURN 1'; do
        echo 'Waiting for Neo4j...'
        sleep 2
      done &&
      cat /provision/neo4j.cypher | cypher-shell -u neo4j -p password --format plain -a bolt://neo4j:7687"

  prometheus:
    image: prom/prometheus:v2.48.1
    container_name: prometheus
    networks:
      - openline
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
      - ./provision/prometheus:/etc/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--web.enable-lifecycle"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.2.3
    container_name: grafana
    networks:
      - openline
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    restart: unless-stopped
    depends_on:
      - prometheus
