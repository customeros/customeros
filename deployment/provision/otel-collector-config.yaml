receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 5000

exporters:
  timescaledb:
    # Note: Tables must be created manually before starting the collector
    # See SQL queries in the documentation for table creation
    endpoint: postgresql://postgres:password@localhost:5556/telemetry
    timeout: 5s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [timescaledb]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [timescaledb]