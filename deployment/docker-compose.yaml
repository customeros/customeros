version: "3.8"

networks:
  openline:

volumes:
  rabbitmq_data:
  postgres_data:
  timescaledb_data:
  nats_data:
  neo4j_data:
  opensearch-data:
  prometheus_data:
  grafana_data:

services:
  rabbitmq:
    image: rabbitmq:management
    container_name: rabbitmq
    networks:
      - openline
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./provision/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf
      - ./provision/rabbitmq-definitions.json:/etc/rabbitmq/definitions.json
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: jaeger
    networks:
      - openline
    ports:
      - "16686:16686"
      - "6831:6831/udp"
      - "6831:6831/tcp"
      - "4317:4317"
      - "4318:4318"
      - "14268:14268"
    environment:
      - LOG_LEVEL=debug

  postgres:
    image: postgres:17.4
    container_name: postgres
    networks:
      - openline
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: openline
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U postgres -d openline -h localhost -p 5432"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 5s

  timescaledb:
    image: timescale/timescaledb:latest-pg17
    container_name: timescaledb
    networks:
      - openline
    ports:
      - "5556:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: mailstack_timeseries
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d mailstack_timeseries -h localhost -p 5432",
        ]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 5s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    networks:
      - openline
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./provision/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4319:4317" # OTLP gRPC receiver
      - "4320:4318" # OTLP HTTP receiver
    healthcheck:
      test:
        ["CMD", "wget", "--no-verbose", "--spider", "http://localhost:13133"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  nats:
    image: nats:2.11.0-alpine
    container_name: nats
    networks:
      - openline
    ports:
      - "4222:4222" # Client connections
      - "8222:8222" # HTTP management
    command:
      - "--jetstream"
      - "--http_port=8222"
      - "--debug=false"
      - "--trace=false"
    volumes:
      - nats_data:/data
    environment:
      - NATS_SERVER_NAME=nats
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3

  neo4j:
    image: neo4j:latest
    container_name: neo4j
    networks:
      - openline
    volumes:
      - neo4j_data:/data
    ports:
      - "7474:7474" # HTTP
      - "7687:7687" # Bolt
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_PLUGINS=["apoc"]
    healthcheck:
      test: wget http://localhost:7474 || exit 1
      interval: 1s
      timeout: 10s
      retries: 20
      start_period: 5s

  neo4j-sidecar:
    image: ghcr.io/customeros/customeros/neo4j-sidecar:latest
    container_name: neo4j-sidecar
    networks:
      - openline
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - ./provision:/provision
    command: >
      sh -c "
      until cypher-shell -u neo4j -p password --format plain -a bolt://neo4j:7687 'RETURN 1'; do
        echo 'Waiting for Neo4j...'
        sleep 2
      done &&
      cat /provision/neo4j.cypher | cypher-shell -u neo4j -p password --format plain -a bolt://neo4j:7687"

  opensearch:
    image: opensearchproject/opensearch:2.11.1
    container_name: opensearch
    environment:
      - "discovery.type=single-node"
      - "plugins.security.disabled=true"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
      - "9600:9600"
    networks:
      - openline

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.11.1
    container_name: opensearch-dashboards
    environment:
      - 'OPENSEARCH_HOSTS=["http://opensearch:9200"]'
      - "DISABLE_SECURITY_DASHBOARDS_PLUGIN=true"
      - "DISABLE_SECURITY_DASHBOARDS=true"
    ports:
      - "5601:5601"
    networks:
      - openline
    depends_on:
      - opensearch

  temporal:
    container_name: temporal
    environment:
      - DB=postgres
      - DB_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PWD=password
      - POSTGRES_SEEDS=postgres
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
      - ENABLE_ES=false
    image: temporalio/auto-setup:1.22.6
    networks:
      - openline
    ports:
      - "7233:7233"
    volumes:
      - ./temporal:/etc/temporal/config/dynamicconfig
    labels:
      kompose.volume.type: configMap

  temporal-admin-tools:
    container_name: temporal-admin-tools
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CLI_ADDRESS=temporal:7233
    image: temporalio/admin-tools:1.22.6
    networks:
      - openline
    stdin_open: true
    tty: true

  temporal-ui:
    container_name: temporal-ui
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    image: temporalio/ui:2.16.2
    networks:
      - openline
    ports:
      - "8080:8080"

  gotenberg:
    image: thecodingmachine/gotenberg:8@sha256:c23c892f5fee99be6ed0fecc295c584f294335f9333373def88899c2a9d38c32
    container_name: gotenberg
    depends_on:
      - neo4j-sidecar
    networks:
      - openline
    ports:
      - "11006:3000"

  customer-os-api:
    image: ghcr.io/customeros/customeros/customer-os-api:latest
    networks:
      - openline
    ports:
      - "10000:10000"
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_ASYNC_HOST=postgres
      - NEO4J_TARGET=neo4j://neo4j:7687
      - RABBITMQ_URL=amqp://guest:guest@host.docker.internal:5672

  customer-os-webhooks:
    image: ghcr.io/customeros/customeros/customer-os-webhooks:latest
    networks:
      - openline
    ports:
      - "10004:10004"
    environment:
      - POSTGRES_HOST=postgres
      - NEO4J_TARGET=neo4j://neo4j:7687
      - RABBITMQ_URL=amqp://host.docker.internal:5672

  prometheus:
    image: prom/prometheus:v2.48.1
    container_name: prometheus
    networks:
      - openline
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
      - ./provision/prometheus:/etc/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--web.enable-lifecycle"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.2.3
    container_name: grafana
    networks:
      - openline
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    restart: unless-stopped
    depends_on:
      - prometheus
