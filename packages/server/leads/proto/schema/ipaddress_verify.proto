syntax = "proto3";

package leads;

option go_package = "github.com/customeros/customeros/packages/server/leads/proto/pb";

message IPAddressVerifyRequest { string ip_address = 1; }

message IPAddressVerifyResponse {
  string ip_address = 1;
  string city = 2;
  string region = 3;
  string country_code = 4;
  bool is_threat = 5;
}
