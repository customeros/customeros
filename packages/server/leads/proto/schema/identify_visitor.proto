syntax = "proto3";

import "google/protobuf/timestamp.proto";

package eventstream;

option go_package = "github.com/customeros/customeros/packages/server/eventstream/proto/pb";

message IdentifyVisitorRequest { string ip_address = 1; }

message IdentifyVisitorResponse {
  string ip_address = 1;
  string domain = 2;
  string errorMessage = 3;
}
