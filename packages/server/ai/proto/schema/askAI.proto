syntax = "proto3";

package ai;

option go_package = "github.com/customeros/customeros/packages/server/ai/proto/pb";

enum AIRequestType {
  AI_REQUEST_GENERIC = 0;
  AI_REQUEST_COMPANY_DESCRIPTION = 1;
  AI_REQUEST_COMPANY_NAME = 2;
  AI_REQUEST_CONTENT_STAGE = 3;
  AI_REQUEST_EMAIL = 4;
  AI_REQUEST_INDUSTRY_CODE = 5;
  AI_REQUEST_WEBPAGE_CATEGORY = 6;
  AI_REQUEST_WEBPAGE_TOPICS = 7;
}

enum AIModel {
  AI_MODEL_UNSPECIFIED = 0;
  AI_MODEL_ANTHROPIC_HAIKU = 1;
  AI_MODEL_ANTHROPIC_SONNET = 2;
  AI_MODEL_DEEPSEEK_CHAT = 3;
  AI_MODEL_DEEPSEEK_QWEN = 4;
  AI_MODEL_GEMINI = 5;
  AI_MODEL_GEMINI_LITE = 6;
  AI_MODEL_GEMMA = 7;
  AI_MODEL_JINA_EMBEDDINGS = 8;
  AI_MODEL_LLAMA_8B = 9;
  AI_MODEL_LLAMA_70B = 10;
  AI_MODEL_MIXTRAL = 11;
  AI_MODEL_WHISPER = 12;
}

enum AIOutputFormat {
  AI_OUTPUT_TEXT = 0;
  AI_OUTPUT_JSON = 1;
}

message askAI {
  string request_id = 1;
  AIRequestType request_type = 2;
  AIModel model = 3;
  optional string system_prompt = 4;
  optional string prompt = 5;
  optional float model_temperature = 6;
  optional int32 max_output_tokens = 7;
  AIOutputFormat output_format = 8;
  optional int32 retries = 9;
}
