  /enrich/v1/person:
    get:
      consumes:
      - application/json
      description: Enriches person information using LinkedIn URL, email, and other
        optional details
      parameters:
      - description: LinkedIn profile URL
        example: https://linkedin.com/in/johndoe
        in: query
        name: linkedinUrl
        type: string
      - description: Email address
        example: john.doe@example.com
        format: email
        in: query
        name: email
        type: string
      - description: First name
        example: John
        in: query
        minLength: 1
        name: firstName
        type: string
      - description: Last name
        example: Doe
        in: query
        minLength: 1
        name: lastName
        type: string
      - default: false
        description: Include mobile number in results
        in: query
        name: includeMobileNumber
