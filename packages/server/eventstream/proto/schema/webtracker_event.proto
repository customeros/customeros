syntax = "proto3";

import "google/protobuf/timestamp.proto";

package eventstream;
option go_package = "github.com/customeros/customeros/packages/server/eventstream/proto/pb";

enum WebTrackerEventType {
  WEB_TRACKER_EVENT_UNSPECIFIED = 0;
  WEB_TRACKER_PAGE_EXIT = 1;
  WEB_TRACKER_PAGE_VIEW = 2;
  WEB_TRACKER_CLICK = 3;
  WEB_TRACKER_IDENTIFY = 4;
}

message WebTrackerEvent {
  string id = 1;
  string visitor_id = 2;
  string ip = 3;
  WebTrackerEventType event_type = 4;
  string event_data = 5;
  google.protobuf.Timestamp timestamp = 6;
  string href = 7;
  string referrer = 8;
  string user_agent = 9;
  string language = 10;
  bool cookies_enabled = 11;
  string screen_resolution = 12;
}
