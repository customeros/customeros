query global_Cache {
  global_Cache {
    cdnLogoUrl
    user {
      id
      emails {
        email
        rawEmail
        primary
      }
      firstName
      lastName
      mailboxes
      onboarding {
        showOnboardingPage
        onboardingInboundStepCompleted
        onboardingOutboundStepCompleted
        onboardingCrmStepCompleted
        onboardingMailstackStepCompleted
      }
    }
    inactiveEmailTokens {
      email
      provider
    }
    activeEmailTokens {
      email
      provider
    }
    mailboxes
    isOwner
    gCliCache {
      id
      type
      display
      data {
        key
        value
        display
      }
    }
    minARRForecastValue
    maxARRForecastValue
    contractsExist
    isFirstLogin
  }
}

