query Organization($id: ID!) {
  organization(id: $id) {
    name
    metadata {
      id
      created
    }
    parentCompanies {
      organization {
        metadata {
          id
        }
        name
      }
    }
    contracts {
      metadata {
        id
      }
    }
    owner {
      id
      firstName
      lastName
      name
    }
    stage
    description
    industry
    website
    domains
    isCustomer
    logo
    icon
    relationship
    leadSource
    tags {
      id
      name
      createdAt
      updatedAt
      appSource
    }
    valueProposition
    socialMedia {
      id
      url
      followersCount
    }
    employees
    yearFounded
    public

    accountDetails {
      churned
      ltv
      renewalSummary {
        arrForecast
        maxArrForecast
        renewalLikelihood
        nextRenewalDate
      }
      onboarding {
        status
        comments
        updatedAt
      }
    }
    locations {
      id
      name
      country
      region
      locality
      zip
      street
      postalCode
      houseNumber
      rawAddress
      locality
      countryCodeA2
      countryCodeA3
    }
    subsidiaries {
      organization {
        metadata {
          id
        }
        name
        parentCompanies {
          organization {
            name
            metadata {
              id
            }
          }
        }
      }
    }
    parentCompanies {
      organization {
        metadata {
          id
        }
      }
    }
    lastTouchpoint {
      lastTouchPointAt
      lastTouchPointType
    }
  }
}
