query getOrganizationsByIds($ids: [ID!]) {
  ui_organizations(ids: $ids) {
    id
    name
    notes
    description
    industry
    market
    website
    logoUrl
    iconUrl
    public
    stage
    relationship
    lastFundingRound
    leadSource
    valueProposition
    slackChannelId
    employees
    yearFounded
    enrichedAt
    enrichedFailedAt
    enrichedRequestedAt
    ltv
    createdAt
    updatedAt
    churnedAt
    renewalSummaryArrForecast
    renewalSummaryMaxArrForecast
    renewalSummaryRenewalLikelihood
    renewalSummaryNextRenewalAt
    onboardingStatus
    onboardingStatusUpdatedAt
    onboardingComments
    lastTouchPointAt
    lastTouchPointType
    contactCount
    parentId
    parentName
    contracts
    contacts
    subsidiaries
    socialMedia {
      id
      url
      alias
      followersCount
    }
    tags {
      name
      entityType
      metadata {
        id
      }
    }
    locations {
      id
      name
      country
      region
      locality
      zip
      street
      postalCode
      houseNumber
      rawAddress
      countryCodeA2
      countryCodeA3
    }
    owner {
      id
      firstName
      lastName
      name
    }
  }
}
