mutation saveAgent($input: AgentSaveInput!) {
  agent_Save(input: $input) {
    id
    type
    tenant
    name
    capabilities {
      id
      type
      name
      action
      optional
      values
      errors
    }
    goal
    isActive
    flowId
    visible
    createdAt
    updatedAt
    error
    color
    icon
  }
}